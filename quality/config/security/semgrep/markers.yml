rules:
    - id: byteplus-python-no-obsolete-markers
      message: Do not use obsolete marker wording in Python source.
      severity: ERROR
      languages:
          - generic
      paths:
          include:
              - /src/**/*.py
              - /scripts/**/*.py
              - /__init__.py
              - /quality/**/*.py
      pattern-regex: '(?i)\b(?:legacy|workaround|backward(?:\s|-)?compat(?:ible|ibility)|compatibility)\b'
    # BytePlus calls a model with a deactivation date "deprecated", and the model table keeps that status word, so
    # the files that hold it are left out of this rule only.
    - id: byteplus-python-no-deprecated-marker
      message: Do not use obsolete marker wording in Python source.
      severity: ERROR
      languages:
          - generic
      paths:
          include:
              - /src/**/*.py
              - /scripts/**/*.py
              - /__init__.py
              - /quality/**/*.py
          exclude:
              - /src/byteplus/models.py
              - /src/config/models/chat.py
              - /src/types/models.py
      pattern-regex: '(?i)\bdeprecated\b'
