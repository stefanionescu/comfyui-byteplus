rules:
    - id: byteplus-python-no-obsolete-markers
      message: Do not use obsolete marker wording in Python source.
      severity: ERROR
      languages:
          - generic
      paths:
          include:
              - /config/**/*.py
              - /src/**/*.py
              - /scripts/**/*.py
              - /__init__.py
              - /quality/**/*.py
          exclude:
              - /quality/config/security/semgrep/markers.yml
              - /src/byteplus/models.py
              - /src/config/models/chat.py
              - /src/types/models.py
      pattern-regex: '(?i)\b(?:legacy|deprecated|workaround|backward(?:\s|-)?compat(?:ible|ibility)|compatibility)\b'
    # BytePlus calls a model with a deactivation date "deprecated", and the model table keeps that status word. These
    # files hold it, so only the other markers are refused there.
    - id: byteplus-python-no-obsolete-markers-model-status
      message: Do not use obsolete marker wording in Python source.
      severity: ERROR
      languages:
          - generic
      paths:
          include:
              - /src/byteplus/models.py
              - /src/config/models/chat.py
              - /src/types/models.py
      pattern-regex: '(?i)\b(?:legacy|workaround|backward(?:\s|-)?compat(?:ible|ibility)|compatibility)\b'
