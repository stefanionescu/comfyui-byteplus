rules:
    - id: byteplus-secrets-hf-token-literal
      message: Do not commit HuggingFace token literals.
      severity: ERROR
      languages:
          - generic
      pattern-regex: 'hf_[A-Za-z0-9]{20,}'
    - id: byteplus-api-key-literal
      message: Keep ModelArk API keys out of the repository. Use ARK_API_KEY or BytePlus settings.
      severity: ERROR
      languages:
          - generic
      pattern-regex: '\bARK_API_KEY["''\]]{0,2}[ \t]*[:=][ \t]*["'']?[A-Za-z0-9+/=_.-]{20,}'
