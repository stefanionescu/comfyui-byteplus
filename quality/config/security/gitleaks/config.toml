title = "BytePlus node secret rules"

[extend]
useDefault = true

[[rules]]
id = "byteplus-credential"
description = "BytePlus ModelArk API key assigned to its environment variable"
regex = '''\bARK_API_KEY["'\]]{0,2}[ \t]*[:=][ \t]*["']?([A-Za-z0-9+/=_.-]{20,})'''
secretGroup = 1
keywords = ["ark_api_key"]
