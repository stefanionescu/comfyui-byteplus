[project]
name = "comfyui-byteplus"
version = "0.1.0"
description = """\
  Use any BytePlus ModelArk model in ComfyUI with your own API key: chat, images, layer splitting, video, 3D, \
  embeddings and preset characters.\
  """
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Stefan Ionescu" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "aiohttp>=3.12,<4",
    "import-linter==2.15",
]

[tool.deptry]
exclude = [".artifacts", ".git", ".venv", "node_modules", "web"]
# ComfyUI supplies torch, and yarl comes with ComfyUI's aiohttp. mise run deps puts the ComfyUI install on the project
# path, so deptry finds them there. Output downloads pass a yarl URL so aiohttp sends a signed address unchanged.
per_rule_ignores.DEP003 = ["torch", "yarl"]
# ComfyUI supplies aiohttp; the dev group installs it only for the type checker and the scripts.
per_rule_ignores.DEP004 = ["aiohttp"]
known_first_party = ["scripts", "src"]

[tool.comfy]
DisplayName = "BytePlus"
Icon = "https://raw.githubusercontent.com/stefanionescu/comfyui-byteplus/main/docs/images/brand/logo.png"
requires-comfyui = ">=0.37.2"

[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the host packages import ComfyUI's modules"
type = "forbidden"
allow_indirect_imports = true
# The node classes and the comfy package are the host boundary: ComfyUI calls them and they speak its types.
source_modules = [
    "src.config",
    "src.byteplus",
    "src.settings",
    "src.storage",
    "src.state",
]
forbidden_modules = [
    "comfy",
    "comfy_api",
    "comfy_api_nodes",
    "comfy_execution",
    "comfy_extras",
    "folder_paths",
    "node_helpers",
    "nodes",
    "server",
]
