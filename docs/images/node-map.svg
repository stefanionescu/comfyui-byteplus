<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-label="Node map. Chat: Attach Document feeds Chat: Ask. Image: Generate feeds Image: Split Layers. Image: Generate and Reference: Add feed references into Video: Generate, and Video: Generate feeds its own references into the next Video: Generate. Request Options feeds any paid node. Model: Info stands alone and needs no key. Video: Download and 3D: Download collect tasks left running, so no link joins them. Paid nodes have a blue bar."><title>Node map. Chat: Attach Document feeds Chat: Ask. Image: Generate feeds Image: Split Layers. Image: Generate and Reference: Add feed references into Video: Generate, and Video: Generate feeds its own references into the next Video: Generate. Request Options feeds any paid node. Model: Info stands alone and needs no key. Video: Download and 3D: Download collect tasks left running, so no link joins them. Paid nodes have a blue bar.</title><rect width="1000" height="660" rx="14" fill="#211927"/><text x="32" y="44" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">How the nodes connect</text><text x="32" y="68" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="normal" fill="#C2BFB9" text-anchor="start">Arrows show a node's output feeding the next node. Paid nodes have a blue bar.</text><text x="32" y="138" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2BFB9" text-anchor="start">Chat</text><rect x="150" y="104" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="150" y="104" width="230" height="5" rx="2" fill="#5C5362"/><text x="164" y="131" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Chat: Attach Document</text><text x="164" y="150" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">A PDF or text file</text><rect x="412" y="104" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="412" y="104" width="230" height="5" rx="2" fill="#0066FC"/><text x="426" y="131" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Chat: Ask</text><text x="426" y="150" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Text, media, and PDF</text><text x="32" y="216" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2BFB9" text-anchor="start">Image</text><rect x="150" y="182" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="150" y="182" width="230" height="5" rx="2" fill="#0066FC"/><text x="164" y="209" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Image: Generate</text><text x="164" y="228" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Images and their addresses</text><rect x="412" y="182" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="412" y="182" width="230" height="5" rx="2" fill="#0066FC"/><text x="426" y="209" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Image: Split Layers</text><text x="426" y="228" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Base, layers, masks</text><text x="32" y="294" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2BFB9" text-anchor="start">Video</text><rect x="412" y="260" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="412" y="260" width="230" height="5" rx="2" fill="#0066FC"/><text x="426" y="287" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Video: Generate</text><text x="426" y="306" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Prompt, frames, references</text><rect x="674" y="260" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="674" y="260" width="230" height="5" rx="2" fill="#5C5362"/><text x="688" y="287" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Video: Download</text><text x="688" y="306" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">A task left running</text><text x="32" y="372" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2BFB9" text-anchor="start">References</text><rect x="150" y="338" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="150" y="338" width="230" height="5" rx="2" fill="#5C5362"/><text x="164" y="365" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Reference: Add</text><text x="164" y="384" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">An asset ID or public address</text><text x="32" y="450" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2BFB9" text-anchor="start">Search</text><rect x="150" y="416" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="150" y="416" width="230" height="5" rx="2" fill="#0066FC"/><text x="164" y="443" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Search: Embed</text><text x="164" y="462" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Embeddings, similarity</text><text x="32" y="528" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2BFB9" text-anchor="start">3D</text><rect x="150" y="494" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="150" y="494" width="230" height="5" rx="2" fill="#0066FC"/><text x="164" y="521" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">3D: Generate</text><text x="164" y="540" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">GLB from a prompt or images</text><rect x="412" y="494" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="412" y="494" width="230" height="5" rx="2" fill="#5C5362"/><text x="426" y="521" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">3D: Download</text><text x="426" y="540" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">A task left running</text><text x="32" y="606" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2BFB9" text-anchor="start">Shared</text><rect x="150" y="572" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="150" y="572" width="230" height="5" rx="2" fill="#5C5362"/><text x="164" y="599" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Request Options</text><text x="164" y="618" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Service tier, extra fields</text><rect x="674" y="572" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="674" y="572" width="230" height="5" rx="2" fill="#5C5362"/><text x="688" y="599" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Model: Info</text><text x="688" y="618" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">What a model takes, free</text><path d="M380 133 H403" stroke="#F0FF41" stroke-width="2" fill="none"/><path d="M412 133 l-10 -6 v12 z" fill="#F0FF41"/><path d="M380 211 H403" stroke="#F0FF41" stroke-width="2" fill="none"/><path d="M412 211 l-10 -6 v12 z" fill="#F0FF41"/><path d="M265 240 V338 M265 289 H403" stroke="#F0FF41" stroke-width="2" fill="none"/><path d="M412 289 l-10 -6 v12 z" fill="#F0FF41"/><path d="M642 279 H658 V250 H560 V251" stroke="#F0FF41" stroke-width="2" fill="none"/><path d="M560 260 l-6 -10 h12 z" fill="#F0FF41"/><path d="M380 601 H403" stroke="#F0FF41" stroke-width="2" fill="none"/><path d="M412 601 l-10 -6 v12 z" fill="#F0FF41"/><text x="424" y="606" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#F0FF41" text-anchor="start">any paid node</text></svg>